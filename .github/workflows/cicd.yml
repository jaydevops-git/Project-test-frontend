name: CI/CD Pipeline to K3s and AWS ECR

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: eu-north-1           # Change to your preferred AWS region
  ECR_REPOSITORY: project-test/backend # Name of your ECR repository
  IMAGE_NAME: project-test/backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 2. Log in to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3. Build, Tag, and Push Docker Image to ECR
      - name: Build, tag, and push image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $REGISTRY/$ECR_REPOSITORY:latest .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest

      # 4. Deploy/Update App on K3s Node via SSH
      - name: Get ECR Password
        id: ecr-pass
        run: echo "PASSWORD=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})" >> $GITHUB_OUTPUT

      - name: Deploy to K3s via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_PASSWORD: ${{ steps.ecr-pass.outputs.PASSWORD }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        with:
          host: ${{ secrets.K3S_HOST_IP }}
          username: ubuntu
          key: ${{ secrets.K3S_SSH_PRIVATE_KEY }}
          envs: ECR_PASSWORD,ECR_REGISTRY,IMAGE_URI
          script: |
            kubectl delete secret ecr-registry-secret --ignore-not-found
            kubectl create secret docker-registry ecr-registry-secret \
              --docker-server=$ECR_REGISTRY \
              --docker-username=AWS \
              --docker-password=$ECR_PASSWORD

            kubectl set image deployment/demo-app demo-app=$IMAGE_URI
            kubectl rollout status deployment/demo-app
